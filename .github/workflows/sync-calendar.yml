name: Auto Sync Google Calendar and Deploy

on: 
  schedule:
    # 2시겤자냤 자동 동기화 (UTC 기줄)
    - cron: '0 */2 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch latest Google Calendar ICS
        run: |
          curl -sSL "https://calendar.google.com/calendar/ical/rd8us2ulpclcik4jgdnq8mqb4c%40group.calendar.google.com/private-ba959c81e63b8d564be9574e771695ff/basic.ics" -o public/google_calendar.ics
          cp public/google_calendar.ics src/data/google_calendar.ics
          node scripts/convertIcs.cjs
 
      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
